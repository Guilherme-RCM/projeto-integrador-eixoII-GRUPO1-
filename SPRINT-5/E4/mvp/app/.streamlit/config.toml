# Configuração do painel da Sprint 4 (streamlit run app/painel_sprint4.py, a partir da raiz do projeto)
[server]
# Só esta máquina acessa o painel; para apresentar de outra máquina, passe --server.address explicitamente.
address = "localhost"

[browser]
# Sem telemetria de uso do Streamlit.
gatherUsageStats = false

[theme]
# Paleta de identidade do painel (ADR-ML-13), a mesma do painel Qt: azul-petróleo nas ações, pérola nas
# superfícies secundárias (barra lateral e campos) e texto escuro sobre fundo branco.
base = "light"
primaryColor = "#293F49"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#ECECEA"
textColor = "#333333"

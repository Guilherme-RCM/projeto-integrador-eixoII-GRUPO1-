[pytest]
testpaths = tests
markers =
    integracao: testes que exigem o MySQL configurado no .env
    parte1: estruturas de dados (Sprint 2, Parte 1)
    parte2: banco de dados (Sprint 2, Parte 2)
    rf03: RF-03 auditoria
    rf17: RF-17 histórico de créditos, pagamentos e saldo
    rf18: RF-18 uma negociação ativa por crédito
    rnf03: RNF-03 auditabilidade
    rnf06: RNF-06 carga transacional e idempotente
    rnf09: RNF-09 fonte e período dos dados
    rnf10: RNF-10 consistência transacional
filterwarnings =
    ignore::pytest.PytestRemovedIn10Warning
    ignore::DeprecationWarning:gherkin.*

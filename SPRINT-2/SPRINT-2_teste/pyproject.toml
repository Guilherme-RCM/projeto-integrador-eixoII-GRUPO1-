# Configuração das ferramentas de qualidade. Limites dos quality gates: scripts/quality_gate.py

[tool.coverage.run]
branch = true
source = ["etl", "src"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.pyright]
include = ["etl", "src", "tests"]
extraPaths = ["."]

# Controle de dependências entre módulos (import-linter)
[tool.importlinter]
root_packages = ["etl", "src"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Estruturas de dados não dependem de ETL nem de banco"
type = "forbidden"
source_modules = ["src.estruturas"]
forbidden_modules = ["etl", "pymysql"]

[[tool.importlinter.contracts]]
name = "Parser é puro: não acessa banco nem configuração"
type = "forbidden"
source_modules = ["etl.parser"]
forbidden_modules = ["pymysql", "etl.config", "etl.carregar_receita", "etl.sql_runner"]

[[tool.importlinter.contracts]]
name = "Estruturas de dados são independentes entre si"
type = "independence"
modules = ["src.estruturas.grafo", "src.estruturas.heap_prioridade", "src.estruturas.indice_hash"]

[[tool.importlinter.contracts]]
name = "Camadas do ETL"
type = "layers"
layers = [
    "etl.relatorio_validacao | etl.carregar_receita | etl.amostra",
    "etl.sql_runner",
    "etl.config | etl.parser",
]
